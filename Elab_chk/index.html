=>x!=='—')),com=new Set([...A].filter(x=>B.has(x)));$('#title').innerHTML=`祖先馬ペア　<strong>${E(sel.a)}</strong> × <strong>${E(sel.b)}</strong>　<span class="badge ${candidate(sel)?'':'bad'}">${candidate(sel)?'候補':'否定'}</span>`;$('#trees').innerHTML=ped(sel.a,'祖先馬ペア（父系）',com)+ped(sel.b,'祖先馬ペア（母系）',com);$('#judge').innerHTML=`<h3>クロス判定</h3><p>共通祖先 ${com.size}頭　成立 ${sel.ok}件／不成立 ${sel.ng}件</p>${[...com].map(x=>`<p>${E(x)}：父系 ${occ(sel.a,x).map(E).join('・')} ／ 母系 ${occ(sel.b,x).map(E).join('・')}</p>`).join('')||'<p>＋4代内の共通祖先なし</p>'}<p>${E(sel.reason)}</p>`}function table(){let ps=filtered(),q=$('#tableSearch').value.trim().toLowerCase(),s=$('#sort').value;if(q)ps=ps.filter(p=>[p.a,p.b,...p.mares].some(x=>x.toLowerCase().includes(q)));ps.sort(s==='name'?(a,b)=>(a.a+a.b).localeCompare(b.a+b,'ja'):s==='ng'?(a,b)=>b.ng-a.ng:(a,b)=>b.ok-a.ok);const show=ps.slice(0,1000);$('#rows')._p=show;$('#rows').innerHTML=show.map((p,i)=>`<tr><td><span class="badge ${candidate(p)?'':'bad'}">${candidate(p)?'候補':'否定'}</span></td><td><button class="link" data-i="${i}">${E(p.a)}</button></td><td>${E(p.b)}</td><td>${p.ok}</td><td>${p.ng}</td><td>${E(p.mares.join('、'))}</td><td>${E(p.reason)}</td></tr>`).join('')}function targetList(){const q=$('#targetSearch').value.trim().toLowerCase(),a=targets.filter(h=>!q||h.name.toLowerCase().includes(q));$('#targetList').innerHTML=a.map(h=>`<button class="pick ${h===target?'on':''}" data-ta="${E(h.name)}">${E(h.name)} <small>${E(h.type)}</small></button>`).join('');targetTree()}function targetTree(){if(target)$('#targetTree').innerHTML=ped(target.name,'対象馬：'+target.name)+`<div class="judge"><h3>馬情報</h3><p>${E(target.type)}　${E(target.lineage||'')} [${E(target.lineageCode||'--')}]　${E(target.sublineage||'')}</p><p>${E(target.stats||'')}</p></div>`}function view(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===v));['compare','table','target'].forEach(x=>$('#'+x).hidden=x!==v);if(v==='table')table();}document.addEventLi
